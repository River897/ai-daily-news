<!DOCTYPE html>

<title>AI 每日快报 | 历史日报</title>
<style>
:root{--bg:#0b0b12;--card-bg:#151524;--border:#282840;--text:#e2e2f0;--text2:#9898b8;--accent:#7c6ff7;--gold:#ffd200;--green:#00cec9;--r:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh}
.hero{background:linear-gradient(135deg,#0b0b1e,#1a1040,#0d1b2a,#0b0b12);border-bottom:1px solid var(--border);padding:60px 24px 50px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 70%,rgba(124,111,247,.12) 0%,transparent 50%),radial-gradient(circle at 70% 30%,rgba(0,212,204,.08) 0%,transparent 50%);pointer-events:none}
.hero h1{font-size:clamp(34px,6vw,56px);font-weight:800;background:linear-gradient(135deg,#b8acff,#7c6ff7,#00d4cc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px;position:relative}
.hero p{font-size:17px;color:var(--text2);position:relative}
.stats{display:flex;justify-content:center;gap:48px;flex-wrap:wrap;padding:20px 24px;background:var(--card-bg);border-bottom:1px solid var(--border)}
.stat-num{font-size:28px;font-weight:700;background:linear-gradient(135deg,#7c6ff7,#00cec9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-lbl{font-size:11px;color:var(--text2);letter-spacing:.1em}
.container{max-width:800px;margin:0 auto;padding:40px 24px 80px}
.container h2{font-size:22px;margin-bottom:24px;color:var(--green);display:flex;align-items:center;gap:10px}
.date-list{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.date-list li{}
.date-list a{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--r);text-decoration:none;color:var(--text);transition:all .2s}
.date-list a:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 16px rgba(124,111,247,.15)}
.date-display{font-size:18px;font-weight:700;color:var(--text);min-width:52px}
.date-weekday{font-size:12px;color:var(--accent);background:rgba(124,111,247,.15);padding:1px 8px;border-radius:10px}
.date-full{font-size:11px;color:var(--text2);margin-left:auto;opacity:.5}
.today-badge{display:inline-block;background:var(--green);color:#000;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;margin-left:6px}
.footer{text-align:center;padding:32px;color:var(--text2);font-size:11px;border-top:1px solid var(--border);line-height:1.8}
.rss-link{display:inline-block;margin-top:24px;padding:10px 24px;background:linear-gradient(135deg,#7c6ff7,#00cec9);color:#fff;text-decoration:none;border-radius:20px;font-size:14px;font-weight:600;transition:transform .2s,box-shadow .2s}
.rss-link:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(124,111,247,.3)}
@media(max-width:768px){.date-list{grid-template-columns:1fr}.hero{padding:40px 16px 30px}}
</style>
</head>
<body>
